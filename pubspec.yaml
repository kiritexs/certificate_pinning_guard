name: certificate_pinning_guard
description: >-
  Bypass-resistant TLS certificate pinning for Dart and Flutter: handshake pinning against a private trust store, plus optional leaf and SPKI pins. Fails closed.
version: 0.1.0
homepage: https://kiritex.com
topics:
  - security
  - certificate-pinning
  - ssl-pinning
  - tls
  - http

repository: https://github.com/kiritexs/certificate_pinning_guard
issue_tracker: https://github.com/kiritexs/certificate_pinning_guard/issues

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
